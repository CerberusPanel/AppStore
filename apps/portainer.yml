id: portainer
name: Portainer
description: Container management UI for Docker and Kubernetes.
category: infrastructure
featured: true

image: portainer/portainer-ce

tags:
  - docker
  - kubernetes

highlights:
  - Docker UI
  - Stack manager
  - Access control

readme: https://github.com/portainer/portainer/raw/refs/heads/master/README.md

versions:
  - tag: latest
    label: Latest

links:
  github: https://github.com/portainer/portainer
  docs: https://docs.portainer.io/

deployments:
  - version: latest
    container_name: portainer
    image: portainer/portainer-ce:latest
    ports:
      - host: 9000
        container: 9000
        label: HTTP
      - host: 9443
        container: 9443
        label: HTTPS
    volumes:
      - host: /var/run/docker.sock
        container: /var/run/docker.sock
        label: Docker Socket
      - host: ./data
        container: /data
        label: Portainer Data
