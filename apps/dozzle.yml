id: dozzle
name: Dozzle
description: Live Docker log viewer with a lightweight UI.
category: observability
featured: false

image: amir20/dozzle

tags:
  - docker
  - logs

highlights:
  - Log streaming
  - Container filtering
  - Lightweight

readme: https://github.com/amir20/dozzle/raw/refs/heads/master/README.md

versions:
  - tag: latest
    label: Latest

links:
  github: https://github.com/amir20/dozzle

deployments:
  - version: latest
    container_name: dozzle
    image: amir20/dozzle:latest
    ports:
      - host: 8080
        container: 8080
        label: Web UI
    volumes:
      - host: /var/run/docker.sock
        container: /var/run/docker.sock
        label: Docker Socket
