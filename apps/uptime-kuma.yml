id: uptime-kuma
name: Uptime Kuma
logo: https://raw.githubusercontent.com/louislam/uptime-kuma/master/public/icon.png
description: Self-hosted monitoring and uptime tracking.
category: monitoring
featured: true

image: louislam/uptime-kuma

tags:
  - monitoring
  - uptime

highlights:
  - Uptime monitoring
  - Status pages
  - Notifications

readme: https://github.com/louislam/uptime-kuma/raw/refs/heads/master/README.md

versions:
  - tag: "2"
    label: "Version 2"
  - tag: "2-slim"
    label: "Version 2 Slim"

links:
  github: https://github.com/louislam/uptime-kuma
  docs: https://github.com/louislam/uptime-kuma/wiki
  website: https://uptime.kuma.pet/

deployments:
  - version: "2"
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    ports:
      - host: 3001
        container: 3001
        label: Web UI
    volumes:
      - host: ./data
        container: /app/data
        label: General App Data
    environment:
      - name: TZ
        value: "UTC"
        label: Timezone

  - version: "2-slim"
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2-slim
    ports:
      - host: 3001
        container: 3001
        label: Web UI
    volumes:
      - host: ./data
        container: /app/data
        label: General App Data