id: uptime-kuma
logo: https://raw.githubusercontent.com/louislam/uptime-kuma/master/public/icon.png
name: Uptime Kuma
description: Self-hosted monitoring and uptime tracking.
image: louislam/uptime-kuma:2
category: monitoring
tags:
  - monitoring
  - uptime
featured: true
highlights:
  - Uptime monitoring
  - Status pages
  - Notifications
readme: https://github.com/louislam/uptime-kuma/raw/refs/heads/master/README.md
versions:
  - 2
  - 2-slim
links:
  - github: https://github.com/louislam/uptime-kuma
  - docs: https://github.com/louislam/uptime-kuma/wiki
  - website: https://uptime.kuma.pet/
versions:
    # This section is for environment variables. These variables are
    # changeable in the web UI and will makeup the compose files.
    #
    # All variables should be in the format of:
    # host:container:label
  2:
    version: 2
    name: uptimekuma
    ports:
      # host:container:label
      - 3001:3001:WebUI
    volumes:
      # host:container:label
      - ./data:/app/data:General_AppData 
  1:
    version: 1
    name: uptimekuma
    ports:
      # host:container:label
      - 3001:3001:WebUI
    volumes:
      # host:container:label
      - ./data:/app/data:General_AppData 